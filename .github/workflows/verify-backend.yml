name: Verify Backend

# Verifies the parts of the PRD that cannot be exercised by the frontend
# typecheck/test/build pipeline: the Deno edge functions and the SQL migrations.
# These run against URL-imported dependencies (deno.land / esm.sh) that are only
# reachable from GitHub-hosted runners, so this is the authoritative verification
# path for those items.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge-functions:
    name: Edge Functions (deno check)
    runs-on: ubuntu-latest
    # Blocking: the deno-check baseline has been cleared (114 -> 0). New
    # genuine type errors in edge functions now fail CI. (Strictness is relaxed
    # via supabase/functions/deno.json strict:false; genuine errors like wrong
    # arg counts / missing properties are still caught.)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check edge functions
        run: |
          set -o pipefail
          # Check every TypeScript file under supabase/functions EXCEPT the
          # vitest specs. Function entrypoints transitively pull in the _shared
          # utilities.
          #
          # US-203: the exclusion is the whole point. supabase/functions/_shared
          # holds seven *.test.ts files that run under vitest and `import
          # { describe } from 'vitest'` — a bare specifier Deno cannot resolve.
          # `deno check` fails module-graph resolution BEFORE type-checking
          # anything and exits 1, so this job reported one error about an import
          # path and never once looked at a function. It was hiding 14 genuine
          # type errors, including a function whose every response path passed a
          # headers bag where a Request belongs and could therefore not answer a
          # request at all.
          # -not -path node_modules because --node-modules-dir=auto creates one
          # under supabase/functions; harmless on a clean checkout, wrong on a
          # cached or re-run job.
          mapfile -t FILES < <(find supabase/functions -name '*.ts' ! -name '*.test.ts' -not -path '*/node_modules/*' | sort)
          echo "Found ${#FILES[@]} edge-function TypeScript files."
          # Fail loudly if the exclusion ever matches everything.
          if [ "${#FILES[@]}" -lt 90 ]; then
            echo "::error::Expected at least 90 edge-function files, found ${#FILES[@]}."
            exit 1
          fi
          # --node-modules-dir=auto lets Deno resolve npm: specifiers that some
          # functions pull in transitively (e.g. optimize-image ->
          # imagemagick_deno -> npm:@imagemagick/magick-wasm). Without it,
          # `deno check` aborts on the first npm: import before type-checking.
          # --config points at the edge-function deno.json (strict:false for
          # the Deno runtime — these functions weren't written to strict TS;
          # genuine type errors like wrong arg counts / missing properties are
          # still caught).
          deno check --config supabase/functions/deno.json --node-modules-dir=auto "${FILES[@]}"

  smoke-functions:
    name: Edge Functions (smoke)
    runs-on: ubuntu-latest
    # US-204. `deno check` is a type check; it cannot see a function that fails
    # at import, registers no handler, or blames the caller's missing
    # credentials on itself. Running them found all three — see
    # scripts/smoke-edge-functions.mjs for what each assertion is standing in
    # for. No database is needed: a function that reaches its own auth or
    # validation check has already proved it loads and answers.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Smoke every edge function
        run: npm run smoke:functions

  migrations:
    name: SQL Migrations (structural lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration structure
        run: node scripts/validate-migrations.mjs

  schema:
    name: Applied Schema (real Postgres)
    runs-on: ubuntu-latest
    # The structural lint above only reads the migrations as text. It cannot see
    # a trigger referencing a column that does not exist, a table the app queries
    # that no migration creates, or an RPC called by a name nothing defines —
    # all of which are invisible to tsc and the unit tests but break at run time.
    # This job applies every migration to a real Postgres and interrogates the
    # result. See scripts/verify-schema.mjs.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentbio
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      DB_URL: postgresql://postgres:postgres@localhost:5432/agentbio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      # verify-schema.mjs has no dependencies, so this job ran without one for
      # as long as it has existed and looked fine. gen-supabase-types.mjs does:
      # its format() shells out to node_modules/prettier/bin/prettier.cjs. The
      # --check step below has therefore never once run — every invocation died
      # with MODULE_NOT_FOUND, which reads as "types.ts has drifted" and is not
      # that at all.
      - name: Install dependencies
        run: npm ci

      - name: Create the Supabase objects migrations depend on
        # auth.users, auth.uid(), storage.*, the anon/authenticated/service_role
        # roles, and the default privileges that hosted Supabase grants.
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f scripts/supabase-prelude.sql

      - name: Apply migrations
        # One pass, and errors are fatal. This was three passes with errors
        # swallowed until US-060 replaced the 89 non-order-independent
        # migrations with a squashed baseline; if that ever regresses, this step
        # fails rather than quietly converging on the next pass.
        # supabase/migrations/archive/ is deliberately not applied.
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "--- $f ---"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          psql "$DB_URL" -tAc "SELECT 'tables: ' || count(*) FROM information_schema.tables WHERE table_schema='public';"

      - name: Verify applied schema against the code that uses it
        run: node scripts/verify-schema.mjs --db-url "$DB_URL"

      - name: Check generated types are in sync with the schema
        # types.ts drifting from the schema is what collapsed every query against
        # a missing table to `never` and produced the ~700-error tsc baseline.
        run: node scripts/gen-supabase-types.mjs --check --db-url "$DB_URL"

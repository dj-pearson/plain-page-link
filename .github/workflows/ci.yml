name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check (ratchet)
        # US-056 is still open, so this cannot yet require zero. It CAN require
        # that the backlog does not grow, which is what actually matters: the
        # job has been permanently red for long enough that its signal was
        # gone, and a red-by-default check is how src/lib/leadSubmission.ts
        # shipped with a TS2769 on the insert that broke every public lead form
        # (US-069). Lower TSC_BASELINE as the count comes down; the job fails if
        # anyone raises it.
        #
        # Note the original carve-out below cited an out-of-sync types.ts as the
        # reason. That is no longer true — `npm run types:check` passes — so the
        # backlog is now ordinary work rather than a blocked dependency.
        run: |
          set -o pipefail
          TSC_BASELINE=116
          COUNT=$(npx tsc --noEmit 2>&1 | grep -cE '^src/.*error TS' || true)
          echo "tsc errors: $COUNT (baseline $TSC_BASELINE)"
          if [ "$COUNT" -gt "$TSC_BASELINE" ]; then
            echo "::error::TypeScript errors rose from $TSC_BASELINE to $COUNT."
            npx tsc --noEmit 2>&1 | grep -E '^src/.*error TS' || true
            exit 1
          fi
          if [ "$COUNT" -lt "$TSC_BASELINE" ]; then
            echo "::notice::Down to $COUNT — lower TSC_BASELINE in .github/workflows/ci.yml."
          fi

  test:
    name: Test
    # Intentionally NOT gated on typecheck: the repo carries a known tsc
    # baseline (out-of-sync src/integrations/supabase/types.ts) that keeps the
    # typecheck job red, which would otherwise skip tests entirely. Tests must
    # run on every push/PR regardless. Re-add `needs: typecheck` once the
    # baseline is cleared.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

  bundle-size:
    name: Bundle Size
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Check bundle size budgets
        run: npm run size-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=-1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=-1

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    # Warn-only initially: surfaces a11y regressions without blocking merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y

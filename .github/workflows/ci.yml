name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        # US-056 closed the backlog: 143 errors -> 0. The ratchet that stood
        # here (fail if the count rises above TSC_BASELINE) existed only
        # because a permanently-red job has no signal — which is how
        # src/lib/leadSubmission.ts shipped with a TS2769 on the insert that
        # broke every public lead form (US-069). With the count at zero the
        # ordinary check is the stronger one, so the ratchet is gone.
        run: npx tsc --noEmit

  test:
    name: Test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        # The build now prerenders every public route with a real browser
        # (US-147), which means the bundle has to boot. src/integrations/
        # supabase/client.ts throws when VITE_SUPABASE_URL/ANON_KEY are absent,
        # so CI has been producing a bundle that could not start — silently,
        # because nothing here ever loaded it. These placeholders only let the
        # marketing routes render; they reach no network, and the real values
        # are set on the Cloudflare Pages project, not here.
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
          VITE_APP_URL: https://agentbio.net
          # This job verifies the bundle, it does not deploy it, and it has no
          # database credentials. Skip the blog rather than prerender empty posts.
          # The Cloudflare Pages deploy must NOT set this (US-148).
          PRERENDER_ALLOW_NO_ARTICLES: '1'

      - name: Verify prerendered pages have their own SEO identity
        # 44 URLs shipped for a year sharing one <title> because nothing
        # compared them. This is what compares them (US-150).
        run: npm run verify:seo
        env:
          VITE_APP_URL: https://agentbio.net

  bundle-size:
    name: Bundle Size
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        # The build now prerenders every public route with a real browser
        # (US-147), which means the bundle has to boot. src/integrations/
        # supabase/client.ts throws when VITE_SUPABASE_URL/ANON_KEY are absent,
        # so CI has been producing a bundle that could not start — silently,
        # because nothing here ever loaded it. These placeholders only let the
        # marketing routes render; they reach no network, and the real values
        # are set on the Cloudflare Pages project, not here.
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
          VITE_APP_URL: https://agentbio.net
          # This job verifies the bundle, it does not deploy it, and it has no
          # database credentials. Skip the blog rather than prerender empty posts.
          # The Cloudflare Pages deploy must NOT set this (US-148).
          PRERENDER_ALLOW_NO_ARTICLES: '1'

      - name: Check bundle size budgets
        run: npm run size-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=-1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=-1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # US-169: 22 user-journey specs that no workflow ran. Unlike the security
      # suite they were all passing and all sound — they had simply never been
      # wired up, so nothing would have said if they stopped.
      #
      # No VITE_SUPABASE_* here: playwright-e2e.config.ts defaults them to the
      # dev server's own origin, which the CSP's connect-src 'self' requires.
      - name: Run E2E suite
        run: npx playwright test --config=playwright-e2e.config.ts

      - name: Upload E2E report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: playwright-report-e2e/
          retention-days: 14

  security-suite:
    name: Security (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # US-168: this suite existed for months and no workflow ran it. Nine of
      # its specs failed and nobody saw, including one that reported an
      # authentication bypass on four endpoints this application does not have.
      #
      # security-chrome only: the security-mobile project is WebKit, and this
      # runner installs Chromium. Adding the WebKit bundle is a separate call,
      # not a silent `|| true` here.
      # No VITE_SUPABASE_* here on purpose. playwright.config.ts defaults them
      # to the dev server's OWN origin, because index.html ships a CSP whose
      # connect-src is 'self' — pointing them at placeholder.supabase.co would
      # have the browser block the connection before any spec saw it.
      - name: Run security suite
        run: npx playwright test --config=playwright.config.ts --project=security-chrome

      - name: Upload security report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: playwright-report/
          retention-days: 14

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    # Blocking as of US-167. It was warn-only "initially", paired with a
    # non-zero per-page baseline — a job that cannot fail, guarding a number
    # that permits the failures it found. Between them the landing page kept a
    # critical violation (a filter control with no accessible name, rendering as
    # an empty box) for as long as anyone had been looking.
    #
    # Every page is at zero now, so the job has something to protect. If it goes
    # red, a page regressed: read the [a11y] lines in the log, which name the
    # element and the reason.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y

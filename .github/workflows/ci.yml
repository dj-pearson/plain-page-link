name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        # US-056 closed the backlog: 143 errors -> 0. The ratchet that stood
        # here (fail if the count rises above TSC_BASELINE) existed only
        # because a permanently-red job has no signal — which is how
        # src/lib/leadSubmission.ts shipped with a TS2769 on the insert that
        # broke every public lead form (US-069). With the count at zero the
        # ordinary check is the stronger one, so the ratchet is gone.
        run: npx tsc --noEmit

  test:
    name: Test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        # The build now prerenders every public route with a real browser
        # (US-147), which means the bundle has to boot. src/integrations/
        # supabase/client.ts throws when VITE_SUPABASE_URL/ANON_KEY are absent,
        # so CI has been producing a bundle that could not start — silently,
        # because nothing here ever loaded it. These placeholders only let the
        # marketing routes render; they reach no network, and the real values
        # are set on the Cloudflare Pages project, not here.
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
          VITE_APP_URL: https://agentbio.net
          # This job verifies the bundle, it does not deploy it, and it has no
          # database credentials. This used to omit the blog entirely, which
          # meant verify:seo below ran against the marketing pages and never saw
          # /blog, /blog/category/{slug} or /blog/{slug} — the pages US-180,
          # US-184 and a third of US-185 were actually on. It now renders three
          # obviously-labelled fixtures from scripts/data/articles.fixture.json
          # instead, so the blog is inside every check (US-186).
          # The Cloudflare Pages deploy must NOT set this (US-148).
          PRERENDER_ALLOW_NO_ARTICLES: '1'

      - name: Verify prerendered pages
        # 44 URLs shipped for a year sharing one <title> because nothing
        # compared them. This is what compares them (US-150), and it has grown:
        # page identity, every sitemap URL reachable from / (US-165), every URL
        # asserted in structured data resolving to a page (US-179), every
        # internal link arriving somewhere (US-184), and FAQ questions AND
        # answers being on the page they are claimed for (US-185).
        run: npm run verify:seo
        env:
          VITE_APP_URL: https://agentbio.net

  bundle-size:
    name: Bundle Size
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        # The build now prerenders every public route with a real browser
        # (US-147), which means the bundle has to boot. src/integrations/
        # supabase/client.ts throws when VITE_SUPABASE_URL/ANON_KEY are absent,
        # so CI has been producing a bundle that could not start — silently,
        # because nothing here ever loaded it. These placeholders only let the
        # marketing routes render; they reach no network, and the real values
        # are set on the Cloudflare Pages project, not here.
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder-anon-key-ci-build-only
          VITE_APP_URL: https://agentbio.net
          # This job verifies the bundle, it does not deploy it, and it has no
          # database credentials. This used to omit the blog entirely, which
          # meant verify:seo below ran against the marketing pages and never saw
          # /blog, /blog/category/{slug} or /blog/{slug} — the pages US-180,
          # US-184 and a third of US-185 were actually on. It now renders three
          # obviously-labelled fixtures from scripts/data/articles.fixture.json
          # instead, so the blog is inside every check (US-186).
          # The Cloudflare Pages deploy must NOT set this (US-148).
          PRERENDER_ALLOW_NO_ARTICLES: '1'

      - name: Check bundle size budgets
        run: npm run size-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=-1

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Run dependency audit (fails on high/critical)
        run: npm audit --audit-level=high

      - name: Run ESLint
        run: npx eslint src/ --max-warnings=-1

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    # US-205: tests/e2e has six specs and 22 tests covering auth, onboarding,
    # public profile visibility, listing deep links, analytics and the page
    # builder — and no workflow had ever run them. They are hermetic (every
    # /rest/v1, /auth/v1 and /functions/v1 call is intercepted, and the config
    # supplies the VITE_SUPABASE_* values the client throws without), so they
    # need no database and finish in under half a minute.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: playwright-report/
          retention-days: 7

  security-tests:
    name: Security (Playwright)
    runs-on: ubuntu-latest
    # US-205: tests/security has 113 tests across auth, XSS, security headers
    # and edge-function authorization, and had never been run by CI either.
    # Slower than the other browser suites — a few minutes, single-worker by
    # config — which is the usual reason a suite like this quietly stops being
    # run. It is the one job here whose subject is what an attacker can do.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run security tests
        run: npm run test:security

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-security
          path: playwright-report/
          retention-days: 7

  accessibility:
    name: Accessibility (axe-core)
    runs-on: ubuntu-latest
    # US-205: this was continue-on-error, "warn-only initially". It has been
    # passing 6/6 against an explicit baseline in tests/a11y, and a job that
    # cannot fail is a job nobody reads. Blocking now; the baseline is what
    # keeps it honest, not the continue-on-error.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        run: npm run test:a11y
